<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>index.html
<meta name="description" content="Siam King Mobile Tools — mobile technicians-এর জন্য দরকারি calculator, converter, device info ও repair utility tools।">
<meta name="keywords" content="mobile technician tools, mobile repair tools, ohm law, battery calculator, storage converter, IMEI checker">
<meta name="theme-color" content="#090b10">
<style>
:root{--bg:#07090d;--panel:#0e1218;--panel2:#111720;--gold:#d4af37;--gold2:#f6df8a;--text:#f7f8fa;--muted:#929baa;--line:#252c36;--ok:#65d391}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% -5%,#d4af3720,transparent 28%),radial-gradient(circle at 100% 15%,#ffffff08,transparent 25%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:20;background:#07090de8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:19px}.brand b{color:var(--gold2)}.tag{font-size:10px;color:var(--gold2);border:1px solid #d4af3750;border-radius:30px;padding:7px 10px}
.hero{max-width:1120px;margin:auto;padding:52px 18px 26px;text-align:center}.crown{font-size:40px}.hero h1{font-size:clamp(31px,7vw,58px);margin:8px 0 12px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}.hero p{max-width:700px;margin:auto;color:var(--muted);line-height:1.7}
.search{max-width:700px;margin:25px auto 0}.search input{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:white;outline:0;font-size:15px}.search input:focus{border-color:#d4af3780}
.wrap{max-width:1120px;margin:auto;padding:0 18px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.section-title h2{font-size:20px;margin:0}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:19px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#d4af3765;box-shadow:0 14px 34px #0008}.icon{width:45px;height:45px;display:grid;place-items:center;border-radius:12px;background:#d4af3715;font-size:22px;margin-bottom:12px}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.open{margin-top:14px;border:1px solid #d4af3740;background:#d4af3715;color:var(--gold2);border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.open:hover{background:#d4af3725}
.tool{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.tool.active{display:block}.tool h3{margin:0 0 15px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool input,.tool select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#080b10;color:#fff;outline:0}.calc{margin-top:12px;padding:10px 14px;border:0;border-radius:10px;background:var(--gold);color:#16120a;font-weight:900;cursor:pointer}.result{margin-top:12px;padding:13px;border-radius:10px;background:#080b10;color:var(--gold2);line-height:1.6;min-height:44px}.note{font-size:12px;color:var(--muted);margin-top:9px}
.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:25px;border:1px dashed var(--line);border-radius:15px;margin-top:15px}
footer{text-align:center;padding:45px 18px;color:var(--muted);font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr}.hero{padding-top:38px}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">👑 Siam King <b>Mobile Tools</b></div><div class="tag">TECH EDITION</div></div></header>

<section class="hero">
 <div class="crown">👑</div>
 <h1>Siam King Mobile Tools</h1>
 <p>মোবাইল টেকনিশিয়ানদের দৈনন্দিন কাজের জন্য দরকারি calculator, converter এবং utility tools — এক জায়গায়।</p>
 <div class="search"><input id="search" placeholder="🔎 Tool খুঁজুন..." oninput="filterTools()"></div>
</section>

<main class="wrap">
 <div class="section-title"><h2>🛠️ Technician Tools</h2><span class="count" id="count">৮টি টুল</span></div>
 <div class="grid" id="grid">

  <article class="card" data-search="battery battery calculator mah runtime power">
   <div class="icon">🔋</div><h3>Battery Runtime</h3><p>Battery capacity ও load থেকে আনুমানিক runtime হিসাব করুন।</p><button class="open" onclick="openTool('battery')">Open Tool</button>
  </article>
  <article class="card" data-search="ohm law voltage current resistance resistor">
   <div class="icon">⚡</div><h3>Ohm's Law</h3><p>Voltage ও Current দিয়ে Resistance হিসাব করুন।</p><button class="open" onclick="openTool('ohm')">Open Tool</button>
  </article>
  <article class="card" data-search="storage converter gb mb kb">
   <div class="icon">💾</div><h3>Storage Converter</h3><p>GB, MB ও KB-এর মধ্যে conversion করুন।</p><button class="open" onclick="openTool('storage')">Open Tool</button>
  </article>
  <article class="card" data-search="device info phone browser screen">
   <div class="icon">📱</div><h3>Device Info</h3><p>Browser, platform, screen ও language-এর basic তথ্য দেখুন।</p><button class="open" onclick="openTool('device')">Open Tool</button>
  </article>
  <article class="card" data-search="imei checker validation checksum">
   <div class="icon">🔢</div><h3>IMEI Validator</h3><p>১৫ সংখ্যার IMEI-এর format ও Luhn checksum যাচাই করুন।</p><button class="open" onclick="openTool('imei')">Open Tool</button>
  </article>
  <article class="card" data-search="voltage mv v converter">
   <div class="icon">🔌</div><h3>mV → V</h3><p>Millivolt থেকে Volt conversion করুন।</p><button class="open" onclick="openTool('mv')">Open Tool</button>
  </article>
  <article class="card" data-search="current ma amp converter">
   <div class="icon">🧲</div><h3>mA → A</h3><p>Milliampere থেকে Ampere conversion করুন।</p><button class="open" onclick="openTool('ma')">Open Tool</button>
  </article>
  <article class="card" data-search="power watt voltage current">
   <div class="icon">💡</div><h3>Power Calculator</h3><p>Voltage ও Current থেকে Power (Watt) হিসাব করুন।</p><button class="open" onclick="openTool('power')">Open Tool</button>
  </article>
 </div>
 <div id="empty" class="empty hidden">কোনো Tool পাওয়া যায়নি। অন্য নামে খুঁজে দেখুন।</div>

 <div id="battery" class="tool"><h3>🔋 Battery Runtime Calculator</h3><div class="inputs"><input id="mah" type="number" placeholder="Battery capacity (mAh)"><input id="load" type="number" placeholder="Load (mA)"></div><button class="calc" onclick="batteryCalc()">Calculate</button><div class="result" id="batteryResult">Result এখানে দেখাবে</div><div class="note">এটি আনুমানিক হিসাব; বাস্তবে efficiency ও battery condition-এর কারণে ফল ভিন্ন হতে পারে।</div></div>

 <div id="ohm" class="tool"><h3>⚡ Ohm's Law — Resistance</h3><div class="inputs"><input id="v" type="number" placeholder="Voltage (V)"><input id="a" type="number" placeholder="Current (A)"></div><button class="calc" onclick="ohmCalc()">Calculate</button><div class="result" id="ohmResult">R = V ÷ I</div></div>

 <div id="storage" class="tool"><h3>💾 Storage Converter</h3><input id="gb" type="number" placeholder="Gigabyte (GB)"><button class="calc" onclick="storageCalc()">Convert</button><div class="result" id="storageResult">Result এখানে দেখাবে</div></div>

 <div id="device" class="tool"><h3>📱 Device Information</h3><div class="result" id="deviceResult">Loading...</div></div>

 <div id="imei" class="tool"><h3>🔢 IMEI Validator</h3><input id="imeiInput" inputmode="numeric" maxlength="15" placeholder="15-digit IMEI"><button class="calc" onclick="imeiCheck()">Check</button><div class="result" id="imeiResult">শুধু নিজের বা অনুমোদিত ডিভাইসের IMEI যাচাই করুন।</div></div>

 <div id="mv" class="tool"><h3>🔌 Millivolt → Volt</h3><input id="mvInput" type="number" placeholder="mV"><button class="calc" onclick="mvCalc()">Convert</button><div class="result" id="mvResult">Result এখানে দেখাবে</div></div>

 <div id="ma" class="tool"><h3>🧲 Milliampere → Ampere</h3><input id="maInput" type="number" placeholder="mA"><button class="calc" onclick="maCalc()">Convert</button><div class="result" id="maResult">Result এখানে দেখাবে</div></div>

 <div id="power" class="tool"><h3>💡 Power Calculator</h3><div class="inputs"><input id="pv" type="number" placeholder="Voltage (V)"><input id="pa" type="number" placeholder="Current (A)"></div><button class="calc" onclick="powerCalc()">Calculate</button><div class="result" id="powerResult">P = V × I</div></div>
</main>

<footer>© 2026 Siam King Mobile Tools · Built for mobile technicians</footer>

<script>
function openTool(id){
 document.querySelectorAll('.tool').forEach(t=>t.classList.remove('active'));
 const el=document.getElementById(id); el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'});
 if(id==='device') showDevice();
}
function filterTools(){
 const q=document.getElementById('search').value.toLowerCase().trim();let shown=0;
 document.querySelectorAll('.card').forEach(c=>{const ok=c.dataset.search.includes(q);c.classList.toggle('hidden',!ok);if(ok)shown++});
 document.getElementById('count').textContent=shown+'টি টুল';document.getElementById('empty').classList.toggle('hidden',shown!==0);
}
function batteryCalc(){let m=+mah.value,l=+load.value;batteryResult.textContent=m>0&&l>0?'আনুমানিক runtime: '+(m/l).toFixed(2)+' ঘণ্টা':'সঠিক সংখ্যা দিন'}
function ohmCalc(){let V=+v.value,A=+a.value;ohmResult.textContent=V>0&&A>0?'Resistance: '+(V/A).toFixed(3)+' Ω':'সঠিক সংখ্যা দিন'}
function storageCalc(){let g=+gb.value;storageResult.textContent=g>=0?g+' GB = '+(g*1024).toFixed(2)+' MB = '+(g*1048576).toFixed(2)+' KB':'সঠিক সংখ্যা দিন'}
function showDevice(){deviceResult.innerHTML='Platform: '+(navigator.platform||'Unknown')+'<br>Screen: '+screen.width+' × '+screen.height+'<br>Language: '+navigator.language+'<br>Online: '+(navigator.onLine?'Yes':'No')}
function imeiCheck(){
 let s=imeiInput.value.replace(/\D/g,'');if(s.length!==15){imeiResult.textContent='IMEI অবশ্যই ১৫ সংখ্যার হতে হবে।';return}
 let sum=0;for(let i=0;i<15;i++){let n=+s[i];if(i%2===1){n*=2;if(n>9)n-=9}sum+=n}
 imeiResult.textContent=sum%10===0?'✓ Checksum Valid':'✕ Checksum Invalid';
}
function mvCalc(){let x=+mvInput.value;mvResult.textContent=x>=0?x+' mV = '+(x/1000).toFixed(4)+' V':'সঠিক সংখ্যা দিন'}
function maCalc(){let x=+maInput.value;maResult.textContent=x>=0?x+' mA = '+(x/1000).toFixed(4)+' A':'সঠিক সংখ্যা দিন'}
function powerCalc(){let V=+pv.value,A=+pa.value;powerResult.textContent=V>=0&&A>=0?'Power: '+(V*A).toFixed(3)+' W':'সঠিক সংখ্যা দিন'}
</script>
</body>
</html>
